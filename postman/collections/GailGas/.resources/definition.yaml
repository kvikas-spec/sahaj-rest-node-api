scripts:
  - type: http:afterResponse
    code: |-
      // ============================================
      // GAIL GAS COLLECTION-LEVEL TEST SUITE
      // Applies to all 78 requests in the collection
      // ============================================

      // 1. RESPONSE STATUS CODE VALIDATION
      pm.test("Status code is valid (2xx, 4xx, or 5xx)", function () {
          pm.expect(pm.response.code).to.be.within(200, 599);
      });

      pm.test("Status code indicates success or expected error", function () {
          const successCodes = [200, 201, 202, 204];
          const clientErrorCodes = [400, 401, 403, 404, 409, 422];
          const serverErrorCodes = [500, 502, 503, 504];
          const allValidCodes = [...successCodes, ...clientErrorCodes, ...serverErrorCodes];
          
          pm.expect(pm.response.code).to.be.oneOf(allValidCodes);
      });

      // 2. RESPONSE TIME CHECKS
      pm.test("Response time is acceptable (under 5 seconds)", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Response time is optimal (under 2 seconds)", function () {
          // This is a warning-level test - APIs should ideally respond within 2 seconds
          if (pm.response.responseTime > 2000) {
              console.warn("Response time exceeded 2 seconds: " + pm.response.responseTime + "ms");
          }
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // 3. CONTENT-TYPE HEADER VALIDATION
      pm.test("Content-Type header is present", function () {
          pm.response.to.have.header("Content-Type");
      });

      pm.test("Response is JSON format", function () {
          const contentType = pm.response.headers.get("Content-Type");
          if (contentType) {
              pm.expect(contentType.toLowerCase()).to.include("application/json");
          }
      });

      // 4. RESPONSE STRUCTURE VALIDATION
      pm.test("Response body is valid JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Response has expected API structure", function () {
          const jsonData = pm.response.json();
          
          // GAIL Gas APIs typically return success/message pattern
          // Check for common response patterns
          const hasSuccessField = jsonData.hasOwnProperty('success') || 
                                 jsonData.hasOwnProperty('Success') ||
                                 jsonData.hasOwnProperty('isSuccess') ||
                                 jsonData.hasOwnProperty('status');
          
          const hasMessageField = jsonData.hasOwnProperty('message') || 
                                 jsonData.hasOwnProperty('Message') ||
                                 jsonData.hasOwnProperty('msg') ||
                                 jsonData.hasOwnProperty('error');
          
          const hasDataField = jsonData.hasOwnProperty('data') || 
                              jsonData.hasOwnProperty('Data') ||
                              jsonData.hasOwnProperty('result') ||
                              jsonData.hasOwnProperty('Result');
          
          // At least one of these patterns should be present
          pm.expect(hasSuccessField || hasMessageField || hasDataField).to.be.true;
      });

      // 5. SUCCESS/MESSAGE FIELD VALIDATION
      pm.test("Success field validation (when present)", function () {
          const jsonData = pm.response.json();
          const successField = jsonData.success ?? jsonData.Success ?? jsonData.isSuccess;
          
          if (successField !== undefined) {
              pm.expect(typeof successField).to.equal('boolean');
              
              // If status is 2xx, success should typically be true
              if (pm.response.code >= 200 && pm.response.code < 300) {
                  // Log warning if success is false on 2xx response
                  if (successField === false) {
                      console.warn("API returned 2xx status but success=false. Message: " + 
                          (jsonData.message || jsonData.Message || "No message"));
                  }
              }
          }
      });

      pm.test("Message field is present and valid (when applicable)", function () {
          const jsonData = pm.response.json();
          const message = jsonData.message ?? jsonData.Message ?? jsonData.msg;
          
          if (message !== undefined) {
              pm.expect(typeof message).to.be.oneOf(['string', 'object']);
              
              if (typeof message === 'string') {
                  pm.expect(message.length).to.be.above(0);
              }
          }
      });

      // 6. AUTHENTICATION CHECKS
      pm.test("Authentication is not rejected (401 check)", function () {
          if (pm.response.code === 401) {
              const jsonData = pm.response.json();
              console.error("Authentication failed. Ensure access_token is valid.");
              console.error("Response: " + JSON.stringify(jsonData));
          }
          // This test passes if NOT 401, fails if 401
          pm.expect(pm.response.code).to.not.equal(401);
      });

      pm.test("Authorization is not forbidden (403 check)", function () {
          if (pm.response.code === 403) {
              const jsonData = pm.response.json();
              console.error("Authorization forbidden. User may lack required permissions.");
              console.error("Response: " + JSON.stringify(jsonData));
          }
          // Log but don't fail - 403 might be expected in some scenarios
          if (pm.response.code === 403) {
              console.warn("Request returned 403 Forbidden");
          }
      });

      // 7. ERROR HANDLING VALIDATION
      pm.test("Error responses have proper structure", function () {
          if (pm.response.code >= 400) {
              const jsonData = pm.response.json();
              
              // Error responses should have a message or error field
              const hasErrorInfo = jsonData.hasOwnProperty('message') || 
                                  jsonData.hasOwnProperty('Message') ||
                                  jsonData.hasOwnProperty('error') ||
                                  jsonData.hasOwnProperty('Error') ||
                                  jsonData.hasOwnProperty('errors') ||
                                  jsonData.hasOwnProperty('errorMessage');
              
              pm.expect(hasErrorInfo).to.be.true;
              
              // Log error details for debugging
              console.log("Error Response [" + pm.response.code + "]: " + JSON.stringify(jsonData));
          }
      });

      pm.test("404 errors have meaningful messages", function () {
          if (pm.response.code === 404) {
              const jsonData = pm.response.json();
              const message = jsonData.message || jsonData.Message || jsonData.error || "";
              
              pm.expect(message.length).to.be.above(0);
              console.log("404 Not Found: " + message);
          }
      });

      pm.test("Server errors (5xx) are logged", function () {
          if (pm.response.code >= 500) {
              const jsonData = pm.response.json();
              console.error("Server Error [" + pm.response.code + "]: " + JSON.stringify(jsonData));
              
              // Server errors should still return valid JSON with error info
              pm.expect(jsonData).to.be.an('object');
          }
          // Test passes if no 5xx error
          pm.expect(pm.response.code).to.be.below(500);
      });

      // 8. DATA STRUCTURE VALIDATION (for successful responses)
      pm.test("Data field structure validation (when present)", function () {
          if (pm.response.code >= 200 && pm.response.code < 300) {
              const jsonData = pm.response.json();
              const data = jsonData.data ?? jsonData.Data ?? jsonData.result ?? jsonData.Result;
              
              if (data !== undefined && data !== null) {
                  // Data should be an object or array
                  pm.expect(data).to.satisfy(function(d) {
                      return typeof d === 'object';
                  });
              }
          }
      });

      // 9. RESPONSE BODY NOT EMPTY
      pm.test("Response body is not empty", function () {
          pm.expect(pm.response.text()).to.not.be.empty;
      });

      // 10. LOGGING FOR DEBUGGING
      // Log request and response details for failed requests
      if (pm.response.code >= 400) {
          console.log("=== REQUEST DETAILS ===");
          console.log("Request: " + pm.info.requestName);
          console.log("Method: " + pm.request.method);
          console.log("URL: " + pm.request.url.toString());
          console.log("=== RESPONSE DETAILS ===");
          console.log("Status: " + pm.response.code + " " + pm.response.status);
          console.log("Response Time: " + pm.response.responseTime + "ms");
      }
    language: text/javascript
