$kind: http-request
url: "{{api_gateway_url}}/auth/access-token"
method: GET
headers:
  x-refresh-token: "{{refresh_token}}"
auth:
  type: bearer
  credentials:
    token: "{{refresh_token}}"
scripts:
  - type: afterResponse
    code: |-
      // Parse the response body JSON
      const responseBody = pm.response.json();

      // Extract access_token and refresh_token from response body
      let accessToken = responseBody.access_token;
      let refreshToken = responseBody.refresh_token;

      // Set tokens in environment variables
      if (accessToken) {
          pm.environment.set("access_token", accessToken);
      }

      if(refreshToken){
          pm.environment.set("refresh_token", refreshToken);
      }
    language: text/javascript
order: 4000
